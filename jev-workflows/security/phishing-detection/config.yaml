workflow: phishing-detection
decision_type: true_false
question: "This email/message contains phishing attempt?"
action_on_true: "flag for review + block sender"
logging: "enabled"

# Phase 7b: New workflow expansion
# Template: Spam Detection (1.00 confidence) → adapted for phishing
confidence_threshold: 0.92
confidence_target: 0.98
escalation_target: 0.02

# Phishing indicators
analysis:
  sender_verification: true  # check sender authenticity
  url_analysis: true  # check for malicious URLs
  domain_similarity: true  # typosquatting detection
  urgency_patterns: true  # artificial urgency tactics
  credential_requests: true  # asks for passwords/tokens
  attachment_analysis: true  # malicious attachments

# Decision criteria
decision_criteria:
  - suspicious_sender: true  # domain mismatch, unusual
  - malicious_links: true  # shortened URLs, redirects
  - credential_theft: true  # login pages, password requests
  - urgency_tactics: true  # "act now", "verify account"
  - domain_spoofing: true  # looks like legitimate domain
  - attachment_risk: true  # .exe, .zip, scripts

# Escalation rules
escalate_when:
  - confidence < 0.92
  - unknown_sender: true
  - internal_address_spoofing: true
  - legitimate_brand_misuse: true

# Reference: Spam Detection (perfect 1.00 score)
# Annual value: $120K
# Daily volume: 180+ emails checked
# Perfect match: Spam/Phishing detection patterns overlap 95%
